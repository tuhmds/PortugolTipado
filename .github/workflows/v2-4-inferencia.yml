name: V2.4 - inferencia sem fallback silencioso

on:
  push:
    branches:
      - feature/v2-4-inferencia-sem-fallback
  workflow_dispatch:

concurrency:
  group: v2-4-inferencia
  cancel-in-progress: true

jobs:
  compilar-e-regredir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar o motor Kotlin
        working-directory: core
        run: gradle fatJar --no-daemon
      - name: Regressoes V2.2
        run: bash tests/v2-2-tipos.sh
      - name: Regressoes V2.3
        run: bash tests/v2-3-inferencia.sh
      - name: Tipagem segura V2.4
        run: bash tests/v2-4-inferencia-segura.sh
