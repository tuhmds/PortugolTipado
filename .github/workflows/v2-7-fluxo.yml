name: V2.7 - fluxo e transferencia de posse

on:
  push:
    branches:
      - feature/v2-7-fluxo-transferencia
  workflow_dispatch:

concurrency:
  group: v2-7-fluxo
  cancel-in-progress: true

jobs:
  kotlin-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar Kotlin
        working-directory: core
        run: gradle fatJar --no-daemon
      - name: Tipagem V2.2
        run: bash tests/v2-2-tipos.sh
      - name: Inferencia V2.3
        run: bash tests/v2-3-inferencia.sh
      - name: Inferencia V2.4
        run: bash tests/v2-4-inferencia-segura.sh
      - name: Tipos nativos V2.5
        run: bash tests/v2-5-tipos-nativos.sh
      - name: Ownership linear V2.6
        run: bash tests/v2-6-ownership.sh
      - name: Fluxo e transferencia V2.7
        run: bash tests/v2-7-fluxo.sh
