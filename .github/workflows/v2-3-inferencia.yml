name: V2.3 - inferencia numerica compartilhada

on:
  push:
    branches:
      - feature/v2-3-promocao-numerica-compartilhada
  workflow_dispatch:

concurrency:
  group: integracao-v2-3
  cancel-in-progress: true

jobs:
  compilar-e-regredir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar compilador Kotlin
        working-directory: core
        run: gradle fatJar --no-daemon
      - name: Testes de tipagem V2.2
        run: bash tests/v2-2-tipos.sh
      - name: Testes de inferencia V2.3
        run: bash tests/v2-3-inferencia.sh
