name: V2.8 - escopos e lacos

on:
  push:
    branches:
      - feature/v2-8-escopos-lacos
  workflow_dispatch:

concurrency:
  group: ownership-v2-8-validated
  cancel-in-progress: true

jobs:
  kotlin-e-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar compilador Kotlin
        working-directory: core
        run: gradle fatJar --no-daemon
      - name: Tipagem V2.2
        run: bash tests/v2-2-tipos.sh
      - name: Promocoes V2.3
        run: bash tests/v2-3-inferencia.sh
      - name: Inferencia V2.4
        run: bash tests/v2-4-inferencia-segura.sh
      - name: Tipos nativos V2.5
        run: bash tests/v2-5-tipos-nativos.sh
      - name: Ownership V2.6
        run: bash tests/v2-6-ownership.sh
      - name: Fluxo V2.7
        run: bash tests/v2-7-fluxo.sh
      - name: Escopos e lacos V2.8
        run: bash tests/v2-8-escopos-lacos.sh
